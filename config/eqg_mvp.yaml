# Pre-production runner. CPU is an operational smoke test, not evidence of hardware advantage.
validation:
  pytest: false                # Optional verification suite; workload smoke still runs.
  verify_evidence: false       # Set true to audit preserved Kingston/Fez reports.
  workload_mvp: true           # Use the canonical MORPH + QAOA MaxCut workload.
  user_workload: null          # Required when workload_mvp is false; Python module path.

execution:
  mode: cpu                    # cpu by default; hardware must be explicitly configured.
  backend: ibm_kingston
  instance: ${IBM_QUANTUM_INSTANCE}
  token_env: IBM_QUANTUM_TOKEN
  confirm_spend: false         # Must be true for hardware submission.
  shots: 2048
  seed: 20261024
  n_logical: 4
  qaoa_p: 1
  delta_min: 0.02
  z_min: 2.0
  ic95_low_min: 0.006

# CSG is a complementary integration, not bundled into EQG source. The bridge
# calls the pinned Rust crate from github.com/dcpracmatic-prog/CSG.
csg:
  enabled: true
  bridge_binary: null       # optional path; otherwise cargo builds the pinned bridge
  project_id: EQG-MVP
  cpu_key_mode: ephemeral_cpu_self_test  # test-only; never a durable identity
  hardware_key_mode: env    # provision keys outside the repo / preferably via KMS
  signer_key_env: EQG_CSG_SIGNER_KEY_HEX
  notary_key_env: EQG_CSG_NOTARY_KEY_HEX
  state_dir: outputs/csg-notary
  enroll_signer: false      # true only for explicit operator bootstrap; otherwise signer must already be authorized

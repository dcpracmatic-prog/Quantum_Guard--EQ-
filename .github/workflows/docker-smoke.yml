name: EQG full pipeline Docker smoke test

concurrency:
  group: eqg-docker-smoke
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-eqg:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build complete EQG image
        run: docker build -t eqg-centinela:latest .
      - name: Run full-stack local simulation (A/C/D/E)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/outputs"
          docker run --rm -v "$GITHUB_WORKSPACE/outputs:/app/outputs" eqg-centinela:latest \
            --mode sim --smoke --output-dir /app/outputs/eqg_ablation
      - name: Verify outputs and all preregistered contrasts
        run: |
          test -s outputs/eqg_ablation/report.eqg.enc
          test -s outputs/eqg_ablation/ablation.eqg.enc
          test -s outputs/eqg_ablation/run_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("outputs/eqg_ablation")
          manifest = json.loads((p / "run_manifest.json").read_text())
          assert manifest["completed"] is True, manifest
          assert manifest["visibility"] == "private", manifest
          assert manifest["integrity_status"] == "encrypted_and_roundtrip_verified_not_csg_signed", manifest
          assert {x["name"] for x in manifest["artifacts"]} == {"report.eqg.enc", "ablation.eqg.enc"}
          PY
      - name: Decrypt only inside the isolated smoke-test container and validate contrasts
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/outputs:/app/outputs" --entrypoint python eqg-centinela:latest -c '
          import json
          from pathlib import Path
          from ddqpu.privacy import decrypt_artifact
          p = Path("/app/outputs/eqg_ablation")
          manifest = json.loads((p / "run_manifest.json").read_text())
          key = p.parent / (manifest["run_id"] + ".key")
          report = json.loads(decrypt_artifact((p / "report.eqg.enc").read_bytes(), key, requester_id="local:root"))
          expected = {"C-A", "D-C", "E-C", "E-D", "E-A"}
          got = {x["contrast"] for x in report["contrasts"]}
          assert expected <= got, (expected, got)
          assert set("ACDE") <= set(report["stats"]), report["stats"].keys()
          assert report["guard"]["protocol"] == "eqg-flow-guard.v1"
          print("EQG_PRIVATE_SMOKE_TEST_OK", sorted(got), "run_id=", manifest["run_id"])
          '

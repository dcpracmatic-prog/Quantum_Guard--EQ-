name: EQG full pipeline Docker smoke test

concurrency:
  group: docker-smoke
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-eqg:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate preserved MORPH MVP evidence and reviewed notebook templates
        run: |
          python3 scripts/validate_product_evidence.py
          python3 scripts/validate_product_notebooks.py
      - name: Build complete EQG image
        run: docker build -t eqg-centinela:latest .
      - name: Verify Qiskit Aer can load in the container
        run: docker run --rm --entrypoint python eqg-centinela:latest -c 'from qiskit_aer import AerSimulator; print("Qiskit Aer import OK")'
      - name: Run canonical MORPH MVP operational smoke and CSG preflight on CPU
        run: |
          mkdir -p outputs/eqg-mvp
          docker run --rm -v "$GITHUB_WORKSPACE/outputs/eqg-mvp:/app/outputs" --entrypoint python eqg-centinela:latest /app/scripts/run_eqg_mvp.py --config /app/config/eqg_mvp.yaml
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("outputs/eqg-mvp/eqg_mvp_cpu_smoke.csg.json")
          data=json.loads(p.read_text())
          assert data["schema_version"] == "eqg.csg-attestation.v1"
          assert data["verification"]["todo_valido"] is True
          assert data["chain_verification"] and all(x["todo_valido"] for x in data["chain_verification"])
          assert data["seal"]["aceptado"] is True
          assert data["key_mode"] == "ephemeral_cpu_self_test"
          print("EQG_CSG_SMOKE_PASS")
          PY
      - name: Run complete regression and adversarial test suite
        run: |
          docker run --rm --entrypoint python eqg-centinela:latest -c '
          import subprocess, sys
          subprocess.run([sys.executable, "-m", "pip", "install", "pytest"], check=True)
          subprocess.run([sys.executable, "-m", "pytest", "-q", "/app/tests"], check=True)
          '
      - name: Run full-stack local simulation (A/C/D/E)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/outputs"
          docker run --rm -v "$GITHUB_WORKSPACE/outputs:/app/outputs" eqg-centinela:latest \
            --mode sim --smoke --output-dir /app/outputs/eqg_ablation
      - name: Verify outputs and all preregistered contrasts
        run: |
          test -s outputs/eqg_ablation/report.eqg.enc
          test -s outputs/eqg_ablation/ablation.eqg.enc
          test -s outputs/eqg_ablation/run_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("outputs/eqg_ablation")
          manifest = json.loads((p / "run_manifest.json").read_text())
          assert manifest["completed"] is True, manifest
          assert manifest["visibility"] == "private", manifest
          assert manifest["integrity_status"] == "encrypted_and_roundtrip_verified_not_csg_signed", manifest
          assert {x["name"] for x in manifest["artifacts"]} == {"report.eqg.enc", "ablation.eqg.enc"}
          PY
      - name: Decrypt only inside the isolated smoke-test container and validate contrasts
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/outputs:/app/outputs" --entrypoint python eqg-centinela:latest -c '
          import json
          from pathlib import Path
          from ddqpu.privacy import decrypt_artifact
          p = Path("/app/outputs/eqg_ablation")
          manifest = json.loads((p / "run_manifest.json").read_text())
          key = p.parent / (manifest["run_id"] + ".key")
          report = json.loads(decrypt_artifact((p / "report.eqg.enc").read_bytes(), key, requester_id="local:root"))
          expected = {"C-A", "D-C", "E-C", "E-D", "E-A"}
          got = {x["contrast"] for x in report["contrasts"]}
          assert expected <= got, (expected, got)
          assert set("ACDE") <= set(report["stats"]), report["stats"].keys()
          assert report["guard"]["protocol"] == "eqg-flow-guard.v1"
          print("EQG_PRIVATE_SMOKE_TEST_OK", sorted(got), "run_id=", manifest["run_id"])
          '

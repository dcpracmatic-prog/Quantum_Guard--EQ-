[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddqpu"
version = "5.0.0"
description = "IBM QPU dynamical decoupling validation with relay control and Sentinel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Elastic License 2.0" }
authors = [
    { name = "Arturo Salvador Balderas Hernández" }
]
dependencies = [
    "qiskit>=1.3",
    "qiskit-ibm-runtime>=0.30",
    "numpy",
    "scipy",
    "matplotlib",
    "cryptography>=42.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "qiskit-aer", "nbformat", "nbconvert", "ipykernel"]
eqg-mvp = ["qiskit-aer", "PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/dcpracmatic-prog/Quantum_Guard--EQ-"
Repository = "https://github.com/dcpracmatic-prog/Quantum_Guard--EQ-"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eqg"
version = "0.1.0"
description = "Select a calibrated qubit layout, execute a workload, and score results."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["qiskit>=1.3", "qiskit-ibm-runtime>=0.40", "numpy>=1.26", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
run_eqg = "eqg.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["eqg"]

[tool.setuptools.package-data]
eqg = ["default.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

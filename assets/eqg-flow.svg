<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="590" viewBox="0 0 1440 590" role="img" aria-labelledby="title desc">
<title id="title">Cómo funciona EQG</title><desc id="desc">EQG lee calibración de un backend cuántico, elige una ruta conectada de cúbits, prepara y ejecuta un circuito, calcula un score y opcionalmente compara con otro layout para producir un veredicto.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111b31"/></linearGradient>
 <linearGradient id="glow" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".35"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8aa4c8"/></marker>
 <style>.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.muted{fill:#9fb0c8}.white{fill:#f8fafc}.small{font-size:15px}.label{font-size:13px;font-weight:700;letter-spacing:1.5px}.title{font-size:25px;font-weight:700}</style>
</defs>
<rect width="1440" height="590" rx="28" fill="url(#bg)"/>
<circle cx="1290" cy="75" r="170" fill="#2563eb" opacity=".08"/><circle cx="120" cy="520" r="175" fill="#06b6d4" opacity=".06"/>
<text class="t label" x="64" y="63" fill="#7dd3fc">EQG · DE LA CALIBRACIÓN AL RESULTADO</text>
<text class="t white" x="64" y="107" font-size="34" font-weight="750">Una carga. Un layout elegido con datos del backend.</text>
<text class="t muted" x="64" y="139" font-size="17">EQG conecta el estado de calibración con la ejecución y el score.</text>
<!-- card 1 -->
<g filter="url(#shadow)"><rect x="55" y="183" width="280" height="244" rx="22" fill="#111f33" stroke="#263a55"/></g>
<rect x="78" y="205" width="38" height="26" rx="13" fill="#1d4ed8"/><text class="t white label" x="91" y="223">01</text>
<text class="t title white" x="78" y="266">Calibración</text><text class="t small muted" x="78" y="292">El backend reporta errores</text><text class="t small muted" x="78" y="313">por cúbit y conectividad.</text>
<!-- grid -->
<g class="t" font-size="13" text-anchor="middle">
 <path d="M121 360H261M121 394H261M121 360V394M168 360V394M215 360V394M261 360V394" stroke="#526985" stroke-width="3"/>
 <circle cx="121" cy="360" r="15" fill="#334155"/><circle cx="168" cy="360" r="15" fill="#0ea5e9"/><circle cx="215" cy="360" r="15" fill="#34d399"/><circle cx="261" cy="360" r="15" fill="#475569"/>
 <circle cx="121" cy="394" r="15" fill="#64748b"/><circle cx="168" cy="394" r="15" fill="#475569"/><circle cx="215" cy="394" r="15" fill="#64748b"/><circle cx="261" cy="394" r="15" fill="#334155"/>
 <text x="121" y="365" fill="white">q0</text><text x="168" y="365" fill="#06121f">q1</text><text x="215" y="365" fill="#06121f">q2</text><text x="261" y="365" fill="white">q3</text>
</g>
<text class="t muted" x="78" y="416" font-size="12">Color: fricción relativa reportada</text>
<!-- arrow --> <path d="M345 303H382" stroke="#8aa4c8" stroke-width="3" marker-end="url(#arrow)"/>
<!-- card 2 -->
<g filter="url(#shadow)"><rect x="395" y="183" width="280" height="244" rx="22" fill="#111f33" stroke="#2563eb" stroke-width="2"/></g>
<rect x="418" y="205" width="38" height="26" rx="13" fill="#1d4ed8"/><text class="t white label" x="431" y="223">02</text>
<text class="t title white" x="418" y="266">EQG elige</text><text class="t small muted" x="418" y="292">Busca una ruta conectada</text><text class="t small muted" x="418" y="313">de baja fricción para la carga.</text>
<path d="M455 366H610" stroke="url(#glow)" stroke-width="8" stroke-linecap="round" opacity=".35"/>
<path d="M455 366H610" stroke="url(#glow)" stroke-width="4" stroke-linecap="round"/>
<g><circle cx="455" cy="366" r="22" fill="#0e7490" stroke="#7dd3fc" stroke-width="3"/><circle cx="506" cy="366" r="22" fill="#0e7490" stroke="#7dd3fc" stroke-width="3"/><circle cx="558" cy="366" r="22" fill="#0e7490" stroke="#7dd3fc" stroke-width="3"/><circle cx="610" cy="366" r="22" fill="#0e7490" stroke="#7dd3fc" stroke-width="3"/>
<text class="t white" x="449" y="371" font-size="13">q1</text><text class="t white" x="500" y="371" font-size="13">q2</text><text class="t white" x="552" y="371" font-size="13">q3</text><text class="t white" x="604" y="371" font-size="13">q4</text></g>
<text class="t" x="418" y="416" fill="#7dd3fc" font-size="13" font-weight="650">Layout físico asignado</text>
<path d="M685 303H722" stroke="#8aa4c8" stroke-width="3" marker-end="url(#arrow)"/>
<!-- card 3 -->
<g filter="url(#shadow)"><rect x="735" y="183" width="280" height="244" rx="22" fill="#111f33" stroke="#263a55"/></g>
<rect x="758" y="205" width="38" height="26" rx="13" fill="#1d4ed8"/><text class="t white label" x="771" y="223">03</text>
<text class="t title white" x="758" y="266">Ejecuta</text><text class="t small muted" x="758" y="292">El circuito se adapta a la</text><text class="t small muted" x="758" y="313">topología y corre en el backend.</text>
<rect x="758" y="347" width="232" height="54" rx="12" fill="#0b1626" stroke="#314862"/>
<text class="t" x="778" y="379" fill="#a5f3fc" font-size="18" font-family="monospace">H ──●──── Rz ──●</text>
<text class="t" x="778" y="395" fill="#a5f3fc" font-size="18" font-family="monospace">     X          X</text>
<path d="M1025 303H1062" stroke="#8aa4c8" stroke-width="3" marker-end="url(#arrow)"/>
<!-- card 4 -->
<g filter="url(#shadow)"><rect x="1075" y="183" width="310" height="244" rx="22" fill="#111f33" stroke="#16a34a" stroke-width="2"/></g>
<rect x="1098" y="205" width="38" height="26" rx="13" fill="#15803d"/><text class="t white label" x="1111" y="223">04</text>
<text class="t title white" x="1098" y="266">Resultado</text><text class="t small muted" x="1098" y="292">Mediciones → score</text>
<rect x="1098" y="319" width="258" height="56" rx="14" fill="#0b1626" stroke="#254237"/>
<text class="t muted" x="1115" y="342" font-size="12">SCORE DE LA CARGA</text><text class="t white" x="1115" y="365" font-size="22" font-weight="700">0.82</text>
<rect x="1260" y="343" width="70" height="8" rx="4" fill="#20334a"/><rect x="1260" y="343" width="58" height="8" rx="4" fill="#34d399"/>
<text class="t" x="1098" y="404" fill="#86efac" font-size="13">Validación opcional → veredicto</text>
<!-- footer -->
<path d="M64 465H1376" stroke="#29394f"/>
<text class="t white" x="64" y="503" font-size="18" font-weight="700">EQG organiza el trabajo físico; no promete milagros universales.</text>
<text class="t muted" x="64" y="533" font-size="15">La selección es heurística. El resultado depende de la calibración, el backend y la carga.</text>
<text class="t" x="1374" y="545" text-anchor="end" fill="#64748b" font-size="12">VISUALIZACIÓN CONCEPTUAL · NO ES UN RESULTADO DE HARDWARE</text>
</svg>

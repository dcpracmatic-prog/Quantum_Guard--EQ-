<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600" role="img" aria-label="EQG Edge Quantum Guard">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a10"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="barEqg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#3ddea8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3ddea8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3ddea8" stop-opacity="0"/>
    </linearGradient>
    <style type="text/css"><![CDATA[
      .title { font: 700 48px "Segoe UI", system-ui, sans-serif; fill: #e9eef6; }
      .title-accent { fill: #3ddea8; }
      .tag { font: 600 11px "Segoe UI", system-ui, sans-serif; fill: #3ddea8; letter-spacing: 0.14em; }
      .lead { font: 400 18px "Segoe UI", system-ui, sans-serif; fill: #8b9bb4; }
      .h2 { font: 600 22px "Segoe UI", system-ui, sans-serif; fill: #e9eef6; }
      .body { font: 400 14px "Segoe UI", system-ui, sans-serif; fill: #8b9bb4; }
      .step { font: 500 13px "Segoe UI", system-ui, sans-serif; fill: #e9eef6; }
      .step-hi { fill: #3ddea8; }
      .card-t { font: 600 14px "Segoe UI", system-ui, sans-serif; fill: #e9eef6; }
      .num { font: 700 28px "Segoe UI", system-ui, sans-serif; fill: #3ddea8; }
      .label { font: 400 11px "Segoe UI", system-ui, sans-serif; fill: #8b9bb4; }
      .ok { font: 600 14px "Segoe UI", system-ui, sans-serif; fill: #3ddea8; }
      .th { font: 500 11px "Segoe UI", system-ui, sans-serif; fill: #8b9bb4; }
      .td { font: 400 13px "Segoe UI", system-ui, sans-serif; fill: #e9eef6; }
      .mono { font: 400 12px ui-monospace, "Cascadia Code", monospace; fill: #c5d0e0; }
      .fade { opacity: 0; animation: fadeUp 0.8s ease forwards; }
      .d1 { animation-delay: 0.1s; }
      .d2 { animation-delay: 0.25s; }
      .d3 { animation-delay: 0.4s; }
      .d4 { animation-delay: 0.55s; }
      .d5 { animation-delay: 0.7s; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
    ]]></style>
  </defs>

  <rect width="900" height="1600" fill="url(#bg)"/>
  <ellipse cx="180" cy="0" rx="320" ry="180" fill="url(#glow)"/>
  <ellipse cx="780" cy="80" rx="260" ry="140" fill="#5b8cff" opacity="0.08"/>

  <!-- Header -->
  <g class="fade d1">
    <rect x="48" y="48" width="78" height="22" rx="11" fill="none" stroke="#3ddea8" stroke-width="1.2"/>
    <text x="87" y="63" text-anchor="middle" class="tag">PRODUCTO</text>
    <text x="48" y="120" class="title title-accent">EQG</text>
    <text x="48" y="168" class="title">Edge Quantum Guard</text>
    <text x="48" y="210" class="lead">Coloca la carga donde el hardware duele menos</text>
    <text x="48" y="236" class="lead">según calibración — y mide si esa decisión aporta.</text>
  </g>

  <!-- Flow -->
  <g class="fade d2">
    <text x="48" y="300" class="h2">Flujo</text>
    <rect x="48" y="320" width="100" height="36" rx="10" fill="#0c1320" stroke="#1a2740"/>
    <text x="98" y="343" text-anchor="middle" class="step">Calibración</text>
    <text x="158" y="343" class="step" fill="#8b9bb4">→</text>
    <rect x="178" y="320" width="108" height="36" rx="10" fill="#0c1320" stroke="#3ddea8"/>
    <text x="232" y="343" text-anchor="middle" class="step step-hi">Layout EQG</text>
    <text x="296" y="343" class="step" fill="#8b9bb4">→</text>
    <rect x="316" y="320" width="88" height="36" rx="10" fill="#0c1320" stroke="#1a2740"/>
    <text x="360" y="343" text-anchor="middle" class="step">Ejecutar</text>
    <text x="414" y="343" class="step" fill="#8b9bb4">→</text>
    <rect x="434" y="320" width="72" height="36" rx="10" fill="#0c1320" stroke="#1a2740"/>
    <text x="470" y="343" text-anchor="middle" class="step">Score</text>
    <text x="516" y="343" class="step" fill="#8b9bb4">→</text>
    <rect x="536" y="320" width="92" height="36" rx="10" fill="#0c1320" stroke="#1a2740"/>
    <text x="582" y="343" text-anchor="middle" class="step">Veredicto</text>

    <rect x="48" y="380" width="380" height="70" rx="12" fill="#0c1320" stroke="#1a2740"/>
    <text x="64" y="408" class="card-t">Operación</text>
    <text x="64" y="430" class="body">Un layout de baja fricción. Un job.</text>

    <rect x="448" y="380" width="400" height="70" rx="12" fill="#0c1320" stroke="#1a2740"/>
    <text x="464" y="408" class="card-t">Validación</text>
    <text x="464" y="430" class="body">EQG vs contraste + contrato Δ / z / IC95</text>
  </g>

  <!-- Bars Kingston -->
  <g class="fade d3">
    <text x="48" y="510" class="h2">Evidencia · ibm_kingston</text>
    <text x="48" y="540" class="body">EQG layout</text>
    <rect x="160" y="528" width="520" height="14" rx="7" fill="#1a2740"/>
    <rect x="160" y="528" width="0" height="14" rx="7" fill="url(#barEqg)">
      <animate attributeName="width" from="0" to="427" dur="1.1s" fill="freeze" begin="0.3s"/>
    </rect>
    <text x="700" y="540" class="body">0.698</text>

    <text x="48" y="575" class="body">Contraste</text>
    <rect x="160" y="563" width="520" height="14" rx="7" fill="#1a2740"/>
    <rect x="160" y="563" width="0" height="14" rx="7" fill="#3a4558">
      <animate attributeName="width" from="0" to="368" dur="1.1s" fill="freeze" begin="0.45s"/>
    </rect>
    <text x="700" y="575" class="body">0.603</text>

    <rect x="48" y="600" width="130" height="64" rx="10" fill="#0c1320" stroke="#1a2740"/>
    <text x="64" y="628" class="num">+0.096</text>
    <text x="64" y="648" class="label">ΔAR</text>

    <rect x="192" y="600" width="110" height="64" rx="10" fill="#0c1320" stroke="#1a2740"/>
    <text x="208" y="628" class="num">11.2</text>
    <text x="208" y="648" class="label">z</text>

    <rect x="316" y="600" width="120" height="64" rx="10" fill="#0c1320" stroke="#1a2740"/>
    <text x="332" y="628" class="num">+0.079</text>
    <text x="332" y="648" class="label">IC95 low</text>

    <rect x="450" y="600" width="110" height="64" rx="10" fill="#0c1320" stroke="#1a2740"/>
    <text x="466" y="632" class="num">PASS</text>
    <text x="466" y="648" class="label">Contrato</text>
  </g>

  <!-- Bars Fez -->
  <g class="fade d4">
    <text x="48" y="720" class="h2">Evidencia · ibm_fez</text>
    <text x="48" y="750" class="body">EQG layout</text>
    <rect x="160" y="738" width="520" height="14" rx="7" fill="#1a2740"/>
    <rect x="160" y="738" width="0" height="14" rx="7" fill="url(#barEqg)">
      <animate attributeName="width" from="0" to="424" dur="1.1s" fill="freeze" begin="0.5s"/>
    </rect>
    <text x="700" y="750" class="body">0.693</text>

    <text x="48" y="785" class="body">Contraste</text>
    <rect x="160" y="773" width="520" height="14" rx="7" fill="#1a2740"/>
    <rect x="160" y="773" width="0" height="14" rx="7" fill="#3a4558">
      <animate attributeName="width" from="0" to="391" dur="1.1s" fill="freeze" begin="0.65s"/>
    </rect>
    <text x="700" y="785" class="body">0.639</text>

    <rect x="48" y="810" width="130" height="64" rx="10" fill="#0c1320" stroke="#1a2740"/>
    <text x="64" y="838" class="num">+0.054</text>
    <text x="64" y="858" class="label">ΔAR</text>

    <rect x="192" y="810" width="110" height="64" rx="10" fill="#0c1320" stroke="#1a2740"/>
    <text x="208" y="838" class="num">6.3</text>
    <text x="208" y="858" class="label">z</text>

    <rect x="316" y="810" width="120" height="64" rx="10" fill="#0c1320" stroke="#1a2740"/>
    <text x="332" y="838" class="num">+0.037</text>
    <text x="332" y="858" class="label">IC95 low</text>

    <rect x="450" y="810" width="110" height="64" rx="10" fill="#0c1320" stroke="#1a2740"/>
    <text x="466" y="842" class="num">PASS</text>
    <text x="466" y="858" class="label">Contrato</text>
  </g>

  <!-- Table -->
  <g class="fade d4">
    <text x="48" y="940" class="h2">Resumen</text>
    <text x="48" y="970" class="th">BACKEND</text>
    <text x="220" y="970" class="th">EQG AR</text>
    <text x="340" y="970" class="th">CONTRASTE</text>
    <text x="480" y="970" class="th">ΔAR</text>
    <text x="580" y="970" class="th">z</text>
    <text x="680" y="970" class="th">GATE</text>
    <line x1="48" y1="980" x2="820" y2="980" stroke="#1a2740"/>

    <text x="48" y="1008" class="td">ibm_kingston</text>
    <text x="220" y="1008" class="td">0.698</text>
    <text x="340" y="1008" class="td">0.603</text>
    <text x="480" y="1008" class="ok">+0.096</text>
    <text x="580" y="1008" class="td">11.2</text>
    <text x="680" y="1008" class="ok">PASS</text>

    <text x="48" y="1038" class="td">ibm_fez</text>
    <text x="220" y="1038" class="td">0.693</text>
    <text x="340" y="1038" class="td">0.639</text>
    <text x="480" y="1038" class="ok">+0.054</text>
    <text x="580" y="1038" class="td">6.3</text>
    <text x="680" y="1038" class="ok">PASS</text>

    <text x="48" y="1075" class="body">N=4 · p=1 · 2048 shots · Δ≥0.02 · z≥2 · IC95 low&gt;0.006</text>
  </g>

  <!-- Scope -->
  <g class="fade d5">
    <text x="48" y="1135" class="h2">Alcance</text>
    <rect x="48" y="1155" width="390" height="90" rx="12" fill="#0c1320" stroke="#1a2740"/>
    <text x="64" y="1185" class="card-t">Sí</text>
    <text x="64" y="1210" class="body">Layout por fricción · QAOA path · score AR</text>
    <text x="64" y="1230" class="body">Veredicto de ganancia de layout</text>

    <rect x="458" y="1155" width="390" height="90" rx="12" fill="#0c1320" stroke="#1a2740"/>
    <text x="474" y="1185" class="card-t">No en esta evidencia</text>
    <text x="474" y="1210" class="body">DD · E1 · multi-brazo · multi-día</text>
    <text x="474" y="1230" class="body">Certificación de seguridad</text>
  </g>

  <!-- API -->
  <g class="fade d5">
    <text x="48" y="1305" class="h2">API</text>
    <rect x="48" y="1320" width="800" height="120" rx="12" fill="#0c1320" stroke="#1a2740"/>
    <text x="64" y="1350" class="mono">select_layout(..., prefer="low" | "high")</text>
    <text x="64" y="1375" class="mono">build_qaoa_path(n, p, gammas, betas)</text>
    <text x="64" y="1400" class="mono">score(counts, n, shots)</text>
    <text x="64" y="1425" class="mono">verdict(delta, se, z)</text>
  </g>

  <text x="48" y="1500" class="body">Licencia ELv2 · github.com/dcpracmatic-prog/Quantum_Guard--EQ-</text>
  <text x="48" y="1540" class="label">EQG — Edge Quantum Guard</text>
</svg>
